<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>超级玛丽 · 网页版</title>
  <style>
    :root {
      --sky: #6eb4ff;
      --ink: #1a1a1a;
      --panel: rgba(0, 0, 0, 0.55);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0b1220;
      color: #fff;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px;
      background:
        radial-gradient(ellipse at 20% 0%, #1a3a5c 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, #14304a 0%, transparent 45%),
        #0b1220;
    }
    h1 {
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .hint {
      font-size: 0.85rem;
      opacity: 0.85;
      text-align: center;
      line-height: 1.5;
    }
    canvas {
      width: min(960px, 100%);
      height: auto;
      aspect-ratio: 960 / 540;
      border-radius: 8px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      background: var(--sky);
      display: block;
      image-rendering: pixelated;
    }
    .pad {
      display: none;
      gap: 10px;
      margin-top: 4px;
      user-select: none;
    }
    .pad button {
      min-width: 64px;
      min-height: 52px;
      border: 0;
      border-radius: 12px;
      background: #243447;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
    }
    .pad button:active { background: #3a5570; }
    @media (max-width: 720px) {
      .pad { display: flex; }
      .desktop-only { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>超级玛丽 · 网页版</h1>
    <p class="hint">
      <span class="desktop-only">← → / A D 移动 · 空格 / W / ↑ 跳跃 · R 重开</span>
      <span>收集金币，踩扁小怪，碰到绿旗过关</span>
    </p>
    <canvas id="game" width="960" height="540"></canvas>
    <div class="pad" aria-label="触控按键">
      <button type="button" id="btnLeft">←</button>
      <button type="button" id="btnRight">→</button>
      <button type="button" id="btnJump">跳</button>
      <button type="button" id="btnReset">R</button>
    </div>
  </div>
  <script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = 960, H = 540, TILE = 48;
  const GRAVITY = 0.55, JUMP = -12.5, SPEED = 5;

  const keys = Object.create(null);
  const levelRows = [
    "....................................................................",
    "....................................................................",
    "....................................................................",
    ".........................C..........................................",
    "......................#######.......................................",
    "..............C.....................................................",
    "...........######.................C........C........................",
    ".................................####....####.......................",
    "......C.............................................................",
    "..P.####..............E.......................E.........C...........",
    "##############...##############...#############################...##",
    "##############...##############...#############################...##",
  ];

  function makeLevel() {
    const width = Math.max(...levelRows.map((r) => r.length));
    const rows = levelRows.map((r) => r.padEnd(width, "."));
    const flagX = width - 4;
    const r7 = rows[7].split("");
    r7[flagX] = "F";
    rows[7] = r7.join("");
    return rows;
  }

  let solids, coins, enemies, flag, player, cameraX, levelW, won, dead, message;

  function reset() {
    const level = makeLevel();
    solids = [];
    coins = [];
    enemies = [];
    flag = null;
    let spawn = { x: TILE * 2, y: TILE * 8 };
    level.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        const x = c * TILE, y = r * TILE;
        if (ch === "#") solids.push({ x, y, w: TILE, h: TILE });
        else if (ch === "C") coins.push({ x: x + TILE / 2, y: y + TILE / 2, baseY: y + TILE / 2, t: Math.random() * 10, taken: false });
        else if (ch === "E") enemies.push({ x: x + 6, y: y + TILE - 28, w: 36, h: 28, speed: -1.8, alive: true });
        else if (ch === "P") spawn = { x: x + 8, y: (r + 1) * TILE - 40 };
        else if (ch === "F") flag = { x: x + 18, y: y - TILE * 3, w: 12, h: TILE * 4 };
      });
    });
    levelW = level[0].length * TILE;
    if (!flag) flag = { x: levelW - 3 * TILE, y: H - 5 * TILE, w: 12, h: 4 * TILE };
    player = {
      x: spawn.x, y: spawn.y, w: 32, h: 40,
      vx: 0, vy: 0, onGround: false, coins: 0, facing: 1,
    };
    const foot = { x: player.x, y: player.y + 1, w: player.w, h: player.h };
    player.onGround = solids.some((s) => overlap(foot, s));
    cameraX = 0;
    won = false;
    dead = false;
    message = "";
  }

  function overlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }

  function ellipse(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x, y, w / 2, h / 2, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBg() {
    ctx.fillStyle = "#6eb4ff";
    ctx.fillRect(0, 0, W, H);
    const ox = -cameraX * 0.2;
    [
      [80, 360, 220, 0],
      [320, 380, 260, 1],
      [620, 350, 200, 2],
      [900, 370, 240, 3],
    ].forEach(([mx, my, mw, i]) => {
      ctx.fillStyle = `rgb(${70 + i * 10},${150 + i * 5},90)`;
      ctx.beginPath();
      ctx.moveTo(ox + mx, H);
      ctx.lineTo(ox + mx + mw / 2, my);
      ctx.lineTo(ox + mx + mw, H);
      ctx.fill();
    });
    [[100, 80], [400, 60], [700, 100], [1100, 70]].forEach(([cx, cy]) => {
      const x = cx - cameraX * 0.35;
      ellipse(x + 45, cy + 20, 90, 40, "#fff");
      ellipse(x + 65, cy + 2, 70, 40, "#fff");
    });
  }

  function drawPlayer() {
    const x = player.x - cameraX;
    const y = player.y;
    rect(x + 4, y + 2, 24, 10, "#dc2828");
    rect(x + 8, y + 10, 16, 12, "#ffc896");
    rect(x + 6, y + 22, 20, 12, "#2850c8");
    rect(x + 10, y + 34, 6, 6, "#141414");
    rect(x + 18, y + 34, 6, 6, "#141414");
  }

  function drawEnemy(e) {
    const x = e.x - cameraX;
    const y = e.y;
    ellipse(x + 18, y + 16, 36, 24, "#a05028");
    ellipse(x + 12, y + 14, 10, 10, "#fff");
    ellipse(x + 24, y + 14, 10, 10, "#fff");
    ellipse(x + 12, y + 14, 4, 4, "#141414");
    ellipse(x + 24, y + 14, 4, 4, "#141414");
  }

  function drawCoin(c) {
    const x = c.x - cameraX;
    const y = c.y;
    ellipse(x, y, 16, 28, "#ffd228");
    ellipse(x, y, 8, 16, "#fff078");
  }

  function drawFlag() {
    const x = flag.x - cameraX;
    rect(x, flag.y, flag.w, flag.h, "#282828");
    ctx.fillStyle = "#28b43c";
    ctx.beginPath();
    ctx.moveTo(x + flag.w, flag.y + 10);
    ctx.lineTo(x + flag.w + 40, flag.y + 28);
    ctx.lineTo(x + flag.w, flag.y + 46);
    ctx.fill();
  }

  function drawUI() {
    ctx.fillStyle = "#fff";
    ctx.font = "24px Microsoft YaHei, sans-serif";
    ctx.fillText(`金币: ${player.coins}`, 16, 32);
    ctx.font = "18px Microsoft YaHei, sans-serif";
    ctx.fillText("←→移动  空格跳跃  R重开", 16, H - 16);
    if (dead || won) {
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.font = "bold 48px Microsoft YaHei, sans-serif";
      ctx.fillStyle = dead ? "#ff5050" : "#50ff78";
      ctx.fillText(dead ? "游戏结束" : "过关成功！", W / 2, H / 2 - 10);
      ctx.font = "22px Microsoft YaHei, sans-serif";
      ctx.fillStyle = "#fff";
      ctx.fillText(dead ? "按 R 重新开始" : `金币 ${player.coins} 枚 · 按 R 再玩一次`, W / 2, H / 2 + 36);
      ctx.textAlign = "left";
    }
  }

  function moveAxis(entity, axis, solidsList) {
    if (axis === "x") {
      entity.x += entity.vx;
      for (const s of solidsList) {
        if (overlap(entity, s)) {
          if (entity.vx > 0) entity.x = s.x - entity.w;
          else if (entity.vx < 0) entity.x = s.x + s.w;
        }
      }
    } else {
      entity.y += entity.vy;
      entity.onGround = false;
      for (const s of solidsList) {
        if (overlap(entity, s)) {
          if (entity.vy > 0) {
            entity.y = s.y - entity.h;
            entity.vy = 0;
            entity.onGround = true;
          } else if (entity.vy < 0) {
            entity.y = s.y + s.h;
            entity.vy = 0;
          }
        }
      }
    }
  }

  function update() {
    if (!dead && !won) {
      player.vx = 0;
      if (keys.left) { player.vx = -SPEED; player.facing = -1; }
      if (keys.right) { player.vx = SPEED; player.facing = 1; }
      if (keys.jump && player.onGround) {
        player.vy = JUMP;
        player.onGround = false;
        keys.jump = false;
      }

      player.vy += GRAVITY;
      if (player.vy > 16) player.vy = 16;
      moveAxis(player, "x", solids);
      moveAxis(player, "y", solids);
      if (player.y > H + 100) dead = true;

      for (const c of coins) {
        if (c.taken) continue;
        c.t += 0.12;
        c.y = c.baseY + 3 * Math.sin(c.t);
        if (overlap(player, { x: c.x - 10, y: c.y - 14, w: 20, h: 28 })) {
          c.taken = true;
          player.coins += 1;
        }
      }

      for (const e of enemies) {
        if (!e.alive) continue;
        e.x += e.speed;
        for (const s of solids) {
          if (overlap(e, s)) {
            if (e.speed > 0) e.x = s.x - e.w;
            else e.x = s.x + s.w;
            e.speed *= -1;
            break;
          }
        }
        const probe = { x: e.x + e.speed * 8, y: e.y + 4, w: e.w, h: e.h };
        if (!solids.some((s) => overlap(probe, s))) e.speed *= -1;

        if (overlap(player, e)) {
          if (player.vy > 0 && player.y + player.h - e.y < 22) {
            e.alive = false;
            player.vy = JUMP * 0.55;
          } else {
            dead = true;
          }
        }
      }

      if (overlap(player, flag)) {
        won = true;
        player.vx = 0;
      }
    }

    cameraX = Math.max(0, Math.min(player.x - W / 3, levelW - W));
  }

  function draw() {
    drawBg();
    for (const s of solids) {
      const x = s.x - cameraX;
      if (x + s.w < 0 || x > W) continue;
      rect(x, s.y, s.w, s.h, "#8c5a28");
      rect(x, s.y, s.w, 12, "#5aa032");
    }
    drawFlag();
    for (const c of coins) if (!c.taken) drawCoin(c);
    for (const e of enemies) if (e.alive) drawEnemy(e);
    drawPlayer();
    drawUI();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (["arrowleft", "a"].includes(k)) keys.left = true;
    if (["arrowright", "d"].includes(k)) keys.right = true;
    if ([" ", "w", "arrowup"].includes(k)) {
      e.preventDefault();
      keys.jump = true;
    }
    if (k === "r") reset();
  });
  window.addEventListener("keyup", (e) => {
    const k = e.key.toLowerCase();
    if (["arrowleft", "a"].includes(k)) keys.left = false;
    if (["arrowright", "d"].includes(k)) keys.right = false;
    if ([" ", "w", "arrowup"].includes(k)) keys.jump = false;
  });

  function bindBtn(id, on, off) {
    const el = document.getElementById(id);
    const start = (e) => { e.preventDefault(); on(); };
    const end = (e) => { e.preventDefault(); off(); };
    el.addEventListener("touchstart", start, { passive: false });
    el.addEventListener("touchend", end, { passive: false });
    el.addEventListener("mousedown", start);
    el.addEventListener("mouseup", end);
    el.addEventListener("mouseleave", end);
  }
  bindBtn("btnLeft", () => keys.left = true, () => keys.left = false);
  bindBtn("btnRight", () => keys.right = true, () => keys.right = false);
  bindBtn("btnJump", () => keys.jump = true, () => keys.jump = false);
  bindBtn("btnReset", () => reset(), () => {});

  reset();
  loop();
})();
  </script>
</body>
</html>
